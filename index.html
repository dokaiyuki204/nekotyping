<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NekoNekoTYPING</title>
        <link rel="stylesheet" href="stylesheet.css">
        <script src="script.js"></script>
    </head>
    <body>
        <div id="title">
            <p>NekoNekoTYPING</p>
            <p>SPACEでスタート</p>
        </div>
        <div id="play">
            <div class="play-space">
                <p id="question"></p>
                <p id="key"></p>
                <div id = "time"></div>
            </div>
        </div>
        <div id="result">
            <p>終了</p>
            <p>かかった時間は<div id ="timer"></div>秒です</p>
            <p>ミスは<div id="miss"></div>回です</p>
            <p>SPACEを押してもう一度挑戦</p>
        </div>
    </body>
</html>
